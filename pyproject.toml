[project]
name = "dipro_unyt"
version = "0.1.0"
description = "An extension of unyt for dipro that adds support for IMAS IDS species types and other metadata"
readme = "README.md"
dependencies = [
    "modshim>=0.5.1",
    "unyt>=3.1.0",
]

[project.scripts]
diprounyt = "dipro_unyt:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

